<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connexion Admin — Petit Paradis</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f3f5f8;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        .logo {
            text-align: center;
            color: #1769e0;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #1769e0;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #1769e0;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0b3d91;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            color: #dc2626;
        }
    </style>
</head>

<script>

document.addEventListener("DOMContentLoaded", () => {

    const loginForm = document.getElementById("loginForm");
    const message = document.getElementById("message");

    console.log("Formulaire trouvé :", loginForm);

    loginForm.addEventListener("submit", async (event) => {

        event.preventDefault();

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;

        message.textContent = "Connexion en cours...";

        try {

            const response = await fetch("/api/admin/login", {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    email: email,
                    password: password
                })
            });

            const result = await response.json();

            if (!response.ok || !result.success) {

                message.textContent =
                    result.message ||
                    "Email ou mot de passe incorrect.";

                return;
            }

            message.style.color = "green";
            message.textContent = "Connexion réussie !";

            window.location.href =
                "/admin/dashboard.html";

        } catch (error) {

            console.error(error);

            message.textContent =
                "Impossible de contacter le serveur.";
        }

    });

});

</script>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="logo">
                PETIT PARADIS
            </div>

            <p class="subtitle">
                Espace administrateur
            </p>

            <form id="loginForm">

                <div class="input-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="admin@petitparadis.com"
                        required>

                </div>

                <div class="input-group">

                    <label for="password">
                        Mot de passe
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Votre mot de passe"
                        required>

                </div>

                <button type="submit">
                    Se connecter
                </button>

                <p id="message"></p>

            </form>

        </div>

    </div>

</body>
</html>
